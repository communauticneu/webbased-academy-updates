name: Build and Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - dev-stage-composition
    paths:
      - 'package.json'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release context
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "package.json version '$version' is not strict x.y.z semver"
            exit 1
          }

          $tag = "v$version"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') {
            if ($env:GITHUB_REF_NAME -ne 'dev-stage-composition') {
              Write-Error "automatic release is only allowed from dev-stage-composition"
              exit 1
            }

            git show-ref --verify --quiet "refs/tags/$tag"
            if ($LASTEXITCODE -eq 0) {
              Write-Error "release tag $tag already exists"
              exit 1
            }

            "AUTO_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              Write-Error "incoming tag $env:GITHUB_REF_NAME does not match package version $tag"
              exit 1
            }
            "AUTO_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF_TYPE -ne 'tag') {
              Write-Error "workflow_dispatch recovery must be started from the matching release tag"
              exit 1
            }
            if ($env:GITHUB_REF_NAME -ne $tag) {
              Write-Error "dispatch tag $env:GITHUB_REF_NAME does not match package version $tag"
              exit 1
            }
            "AUTO_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          Write-Error "unsupported release event"
          exit 1

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Create release tag
        if: env.AUTO_RELEASE == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$env:RELEASE_TAG" "$env:GITHUB_SHA"
          git push origin "$env:RELEASE_TAG"

      - name: Build Windows release assets
        run: npx electron-builder --win nsis --publish never

      - name: Publish Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "releases/Webbased-Academy-Creator-Setup-$env:RELEASE_VERSION.exe"
          $blockmap = "$exe.blockmap"
          $latest = "releases/latest.yml"

          foreach ($asset in @($exe, $blockmap, $latest)) {
            if (-not (Test-Path $asset)) {
              Write-Error "required release asset missing after build: $asset"
              exit 1
            }
          }

          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "$env:RELEASE_VERSION" --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload "$env:RELEASE_TAG" "$exe" "$blockmap" "$latest" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $assetsJson = gh release view "$env:RELEASE_TAG" --json assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = ($assetsJson | ConvertFrom-Json).assets.name
          $required = @(
            "Webbased-Academy-Creator-Setup-$env:RELEASE_VERSION.exe",
            "Webbased-Academy-Creator-Setup-$env:RELEASE_VERSION.exe.blockmap",
            "latest.yml"
          )
          foreach ($name in $required) {
            if ($assets -notcontains $name) {
              Write-Error "release verification failed; missing asset: $name"
              exit 1
            }
          }
