name: Windows Test - No Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev-stage-composition
    paths:
      - 'src/**'
      - 'test/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-test.yml'

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci

      - name: Run automated tests on Windows
        run: npm test

      - name: Run Creator visual/runtime check on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run visual:check
          if (-not (Test-Path 'academy-visual-latest.png')) {
            Write-Error 'Visual/runtime check did not create its verification screenshot.'
            exit 1
          }

      - name: Build unpacked Windows application
        if: always()
        run: npx electron-builder --win dir --publish never

      - name: Verify packaged Windows executable
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path releases -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -eq 'Webbased Academy Creator.exe' } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error 'Packaged Windows executable was not created.'
            exit 1
          }
          if ($exe.Length -lt 1MB) {
            Write-Error "Packaged executable is unexpectedly small: $($exe.Length) bytes"
            exit 1
          }
          Write-Host "Windows executable verified: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Launch packaged Creator on Windows
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path releases -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -eq 'Webbased Academy Creator.exe' } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error 'Cannot launch packaged Creator because executable is missing.'
            exit 1
          }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Write-Error "Packaged Creator exited during Windows launch smoke test. Exit code: $($process.ExitCode)"
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Packaged Creator remained alive during Windows launch smoke test.'

      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webbased-academy-windows-runtime-evidence
          path: academy-visual-latest.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webbased-academy-windows-test
          path: releases/win-unpacked/
          if-no-files-found: error
          retention-days: 7
